name: Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build backend image
        run: docker build -t resonantia-backend ./backend

      - name: Build temporal worker image
        run: docker build -f ./backend/Dockerfile -t resonantia-temporal-worker ./backend

      - name: Build frontend image
        run: docker build -t resonantia-frontend ./frontend
