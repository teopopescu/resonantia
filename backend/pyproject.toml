[project]
name = "resonantia-backend"
version = "0.1.0"
description = "Resonantia — Agentic OS for Lab Informatics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "anthropic>=0.94.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.135.3",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "pillow>=11.0.0",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.26",
    "redis>=7.4.0",
    "sqlalchemy>=2.0.49",
    "sse-starlette>=2.2.0",
    "uvicorn>=0.44.0",
    "aiofiles>=24.1.0",
    "temporalio>=1.25.0",
    "langfuse>=4.2.0",
    "ragas>=0.4.3",
    "matplotlib>=3.10.8",
    "openai>=2.31.0",
    "markdown>=3.10.2",
    "weasyprint>=68.1",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "greenlet>=3.4.0",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/resonantia"]
